# Render blueprint. One web service runs the Fastify API and serves the built
# single-page app from the same process, so there is one URL and no CORS.
#
# Deploy: push this repository to GitHub, then on Render choose
# New > Blueprint and point it at the repo. Everything below is picked up.
services:
  - type: web
    name: relaunch-india
    runtime: node
    plan: free
    region: singapore
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip Vite and TypeScript and leave nothing to build the app with.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      # Each AWS service is an independent switch, and every one defaults to a
      # local implementation. Set a switch here and its credentials below to
      # turn that service on; leave it out and the app still runs.
      #   RELAUNCH_STORE=dynamodb  RELAUNCH_ARTIFACTS=s3
      #   RELAUNCH_EVENTS=eventbridge  RELAUNCH_MODEL=bedrock
      # Publish the seeded role on boot, so the first visitor lands on a live
      # demo (an alert, a match report) instead of an unpublished draft.
      - key: RELAUNCH_SEED_PUBLISHED
        value: 'true'
      # Amazon SES carries email at runtime - the qualifying Communication
      # Developer Service. Secrets are left unset here on purpose: enter them in
      # the Render dashboard so they never enter the repository.
      - key: RELAUNCH_EMAIL
        value: ses
      - key: AWS_REGION
        value: ap-south-1
      - key: SES_FROM_ADDRESS
        sync: false
      # While the SES account is in the sandbox, every recipient must be a
      # verified identity. Set this to your verified address and all mail is
      # routed there, with the intended recipient named in the subject.
      - key: SES_OVERRIDE_TO
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
