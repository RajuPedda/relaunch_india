<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0e1417">ReLaunch India — architecture</text>
  <text x="40" y="70" font-size="13.5" fill="#4b5a61">AI-assisted work capability, human-reviewed evidence, and two-way job matching. Communication Developer Services carry every two-way exchange.</text>

  <!-- ============ actors ============ -->
  <rect x="40" y="104" width="196" height="300" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="56" y="128" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">PEOPLE</text>

  <rect x="56" y="142" width="164" height="60" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="70" y="164" font-size="13.5" font-weight="600" fill="#0e1417">Worker</text>
  <text x="70" y="182" font-size="11.5" fill="#4b5a61">Work sample, practice,</text>
  <text x="70" y="195" font-size="11.5" fill="#4b5a61">reassessment, consent</text>

  <rect x="56" y="214" width="164" height="60" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="70" y="236" font-size="13.5" font-weight="600" fill="#0e1417">Employer</text>
  <text x="70" y="254" font-size="11.5" fill="#4b5a61">Publishes a role,</text>
  <text x="70" y="267" font-size="11.5" fill="#4b5a61">confirms requirements</text>

  <rect x="56" y="286" width="164" height="60" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="70" y="308" font-size="13.5" font-weight="600" fill="#0e1417">Domain expert</text>
  <text x="70" y="326" font-size="11.5" fill="#4b5a61">Approves role configs,</text>
  <text x="70" y="339" font-size="11.5" fill="#4b5a61">resolves disputes</text>

  <rect x="56" y="358" width="164" height="32" rx="8" fill="#e6f4e6" stroke="#0ca30c"/>
  <text x="70" y="378" font-size="11.5" fill="#15610f">Decisions stay with people</text>

  <!-- ============ CDS band ============ -->
  <rect x="266" y="104" width="214" height="300" rx="10" fill="#fdf0d6" stroke="#fab219" stroke-width="2"/>
  <text x="282" y="128" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74510a">AWS CDS — QUALIFYING</text>

  <rect x="282" y="142" width="182" height="74" rx="8" fill="#ffffff" stroke="#fab219"/>
  <text x="296" y="164" font-size="13" font-weight="600" fill="#0e1417">End User Messaging</text>
  <text x="296" y="180" font-size="13" font-weight="600" fill="#0e1417">Social — WhatsApp</text>
  <text x="296" y="199" font-size="11.5" fill="#4b5a61">Job alerts, clarifications,</text>
  <text x="296" y="211" font-size="11.5" fill="#4b5a61">inbound replies</text>

  <rect x="282" y="228" width="182" height="74" rx="8" fill="#ffffff" stroke="#fab219"/>
  <text x="296" y="250" font-size="13" font-weight="600" fill="#0e1417">Amazon SES</text>
  <text x="296" y="269" font-size="11.5" fill="#4b5a61">Match reports, interview</text>
  <text x="296" y="281" font-size="11.5" fill="#4b5a61">offers, daily digests</text>
  <text x="296" y="295" font-size="11.5" fill="#4b5a61">Inbound via SNS webhook</text>

  <rect x="282" y="314" width="182" height="76" rx="8" fill="#ffffff" stroke="#dce2e5"/>
  <text x="296" y="334" font-size="11" font-weight="700" letter-spacing="1" fill="#74848b">DELIVERY GATE</text>
  <text x="296" y="352" font-size="11.5" fill="#4b5a61">Consent · opt-in · pause</text>
  <text x="296" y="366" font-size="11.5" fill="#4b5a61">Dedupe · quiet hours</text>
  <text x="296" y="380" font-size="11.5" fill="#4b5a61">Digest · correlation id</text>

  <!-- ============ application ============ -->
  <rect x="510" y="104" width="300" height="300" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="526" y="128" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">APPLICATION — AWS LAMBDA / CONTAINER</text>

  <rect x="526" y="142" width="268" height="46" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="540" y="162" font-size="13" font-weight="600" fill="#0e1417">React single-page app</text>
  <text x="540" y="179" font-size="11.5" fill="#4b5a61">Worker · Employer · Admin · Reviewer · Measures</text>

  <rect x="526" y="198" width="268" height="192" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="540" y="218" font-size="13" font-weight="600" fill="#0e1417">Domain services (Fastify)</text>

  <rect x="540" y="230" width="118" height="34" rx="6" fill="#eff2f3"/>
  <text x="550" y="245" font-size="11" fill="#0e1417">Role intake</text>
  <text x="550" y="257" font-size="10.5" fill="#74848b">expert-approval gate</text>

  <rect x="666" y="230" width="114" height="34" rx="6" fill="#eff2f3"/>
  <text x="676" y="245" font-size="11" fill="#0e1417">Assessment</text>
  <text x="676" y="257" font-size="10.5" fill="#74848b">checks · rubric · review</text>

  <rect x="540" y="272" width="118" height="34" rx="6" fill="#eff2f3"/>
  <text x="550" y="287" font-size="11" fill="#0e1417">Evidence ledger</text>
  <text x="550" y="299" font-size="10.5" fill="#74848b">claim vs proof</text>

  <rect x="666" y="272" width="114" height="34" rx="6" fill="#eff2f3"/>
  <text x="676" y="287" font-size="11" fill="#0e1417">Matching</text>
  <text x="676" y="299" font-size="10.5" fill="#74848b">per requirement</text>

  <rect x="540" y="314" width="118" height="34" rx="6" fill="#eff2f3"/>
  <text x="550" y="329" font-size="11" fill="#0e1417">Applications</text>
  <text x="550" y="341" font-size="10.5" fill="#74848b">one shared thread</text>

  <rect x="666" y="314" width="114" height="34" rx="6" fill="#eff2f3"/>
  <text x="676" y="329" font-size="11" fill="#0e1417">Notifications</text>
  <text x="676" y="341" font-size="10.5" fill="#74848b">the delivery gate</text>

  <rect x="540" y="356" width="240" height="24" rx="6" fill="#e4eefb"/>
  <text x="550" y="372" font-size="11" fill="#1b5390">Each AWS service sits behind an adapter</text>

  <!-- ============ agent ============ -->
  <rect x="840" y="104" width="360" height="146" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="856" y="128" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">AGENT LAYER</text>
  <rect x="856" y="142" width="328" height="92" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="870" y="162" font-size="13" font-weight="600" fill="#0e1417">Amazon Bedrock · AgentCore</text>
  <text x="870" y="181" font-size="11.5" fill="#4b5a61">1. Drafts role configs, rubrics and task sets</text>
  <text x="870" y="196" font-size="11.5" fill="#4b5a61">2. Extracts job requirements for employer confirmation</text>
  <text x="870" y="211" font-size="11.5" fill="#4b5a61">3. Applies the approved rubric, cites evidence</text>
  <text x="870" y="226" font-size="11.5" fill="#0ca30c">Low confidence or high consequence → human reviewer</text>

  <!-- ============ events ============ -->
  <rect x="840" y="262" width="360" height="142" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="856" y="286" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">AMAZON EVENTBRIDGE</text>
  <rect x="856" y="300" width="328" height="88" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="870" y="320" font-size="11.5" font-family="monospace" fill="#0e1417">job.published   job.changed   job.closed</text>
  <text x="870" y="338" font-size="11.5" font-family="monospace" fill="#0e1417">assessment.completed   evidence.approved</text>
  <text x="870" y="356" font-size="11.5" font-family="monospace" fill="#0e1417">application.submitted   application.updated</text>
  <text x="870" y="377" font-size="11.5" fill="#4b5a61">Each rule recomputes matches, then notifies both parties</text>

  <!-- ============ data ============ -->
  <rect x="510" y="424" width="690" height="128" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="526" y="448" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">STATE</text>

  <rect x="526" y="462" width="330" height="74" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="540" y="482" font-size="13" font-weight="600" fill="#0e1417">Amazon DynamoDB</text>
  <text x="540" y="500" font-size="11.5" fill="#4b5a61">Roles, profiles, submissions, assessments, evidence,</text>
  <text x="540" y="514" font-size="11.5" fill="#4b5a61">jobs, matches, applications, consent, audit, effort</text>
  <text x="540" y="528" font-size="11" fill="#74848b">Single table (pk, sk) — GSIs declared in store.ts</text>

  <rect x="870" y="462" width="314" height="74" rx="8" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="884" y="482" font-size="13" font-weight="600" fill="#0e1417">Amazon S3</text>
  <text x="884" y="500" font-size="11.5" fill="#4b5a61">Work artifacts, reference material.</text>
  <text x="884" y="514" font-size="11.5" fill="#4b5a61">Records hold a pointer, never the body, so each</text>
  <text x="884" y="528" font-size="11.5" fill="#4b5a61">artifact is access-controlled on its own.</text>

  <!-- ============ journey ============ -->
  <rect x="40" y="424" width="440" height="128" rx="10" fill="#ffffff" stroke="#dce2e5"/>
  <text x="56" y="448" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">THE JOURNEY</text>
  <text x="56" y="470" font-size="11.5" fill="#0e1417"><tspan font-weight="700">1</tspan>  Employer publishes → opted-in workers alerted</text>
  <text x="56" y="488" font-size="11.5" fill="#0e1417"><tspan font-weight="700">2</tspan>  Baseline work sample assessed against the rubric</text>
  <text x="56" y="506" font-size="11.5" fill="#0e1417"><tspan font-weight="700">3</tspan>  Workflow taught, observed gap practised</text>
  <text x="56" y="524" font-size="11.5" fill="#0e1417"><tspan font-weight="700">4</tspan>  Unseen reassessment → human review → evidence</text>
  <text x="56" y="542" font-size="11.5" fill="#0e1417"><tspan font-weight="700">5</tspan>  Consented application → match report → reply</text>

  <!-- ============ guardrails ============ -->
  <rect x="40" y="572" width="1160" height="96" rx="10" fill="#f4f6f7" stroke="#dce2e5"/>
  <text x="56" y="596" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">GUARDRAILS BUILT INTO THE DATA MODEL, NOT BOLTED ON</text>
  <text x="56" y="618" font-size="11.5" fill="#4b5a61">• A role config cannot assess anyone until a domain expert approves it; high-consequence roles also need an expert-scored calibration example.</text>
  <text x="56" y="636" font-size="11.5" fill="#4b5a61">• Reviewed evidence, self-reported claims, unexercised skills and observed gaps are four distinct states — never collapsed into one score or percentage.</text>
  <text x="56" y="654" font-size="11.5" fill="#4b5a61">• Unknown information asks a question; it never counts against the person. Matching orders a queue and never rejects an applicant.</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="688" width="1160" height="76" rx="10" fill="#ffffff" stroke="#dce2e5"/>
  <text x="56" y="710" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74848b">DATA AND DECISION BOUNDARIES</text>
  <text x="56" y="730" font-size="11.5" fill="#4b5a61">Approved or synthetic work samples only. Consent records name the employer and the job terms version the sharing was granted for. Confidential job</text>
  <text x="56" y="748" font-size="11.5" fill="#4b5a61">search is kept apart from employer-sponsored development. No sensitive characteristics are inferred. Task scores alone never make an employment decision.</text>

  <!-- ============ connectors ============ -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 z" fill="#74848b"/>
    </marker>
  </defs>
  <line x1="220" y1="172" x2="278" y2="172" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="278" y1="258" x2="222" y2="244" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="468" y1="200" x2="522" y2="230" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="522" y1="300" x2="468" y2="270" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="798" y1="200" x2="852" y2="186" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="852" y1="330" x2="798" y2="320" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="660" y1="396" x2="660" y2="458" stroke="#74848b" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
